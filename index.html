<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="viewport" content="height=device-height, initial-scale=1.0">
  <title>Pokedex</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="./pokeball.png" type="image/x-icon">
</head>
  <body>
  <div class="frontPage">
  <header class="header">
    <div class="innerHeader">
    <div class="left-header">
      <img src="./pokeball.png" class="header-img">
      <a href="">Home</a>
    </div>
        <div class="queryContainer">
          <button class="button" onclick="resetPokemon(1,20)">Reset</button>
          <input placeholder="Nach Pokemon suchen" type="text" id="input" min-length="3" data-id="search-input" required>
          <button class="button" type="button" onclick="searchForPokemon(document.getElementById('input').value)">Search</button>
        </div>
        </div>
  </header>
  <main class="pokemonContainer" id="pokemonContainerRef" data-id="content">
    <dialog id="dialog" class="dialog" data-id="dialog"  onclick="closeDialog(event)">
      <div id="dialogContainer" data-id="overlay-pokemon-name" class="innerContainerDialog" onclick="event.stopPropagation()">
      </div>

    </dialog>
    <ul id="showcase" class="gridContainer">
    </ul>
      <button id="loadBtn" class="loadBtn" onclick="loadMorePokemon()" data-id="load-more-button">↓</button>
      <div id="spinner" class="spinner hidden"></div>
    </main>
  <footer class="footer">
    <div class="innerFooterContainer">
      <div>
        Developer Akademie
     </div>
     <div>
        Sean Boutabba
     </div>
    </div>
  </footer>
  </div>
</body>
<script src="script.js"></script>
</html>
